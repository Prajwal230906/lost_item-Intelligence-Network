server:
  port: ${SERVER_PORT:8080}
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: lost-item-intelligence-network
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lost_item_network?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:lostapp}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  thymeleaf:
    cache: false
app:
  matching:
    category-weight: ${MATCH_CATEGORY_WEIGHT:0.25}
    description-weight: ${MATCH_DESCRIPTION_WEIGHT:0.35}
    location-weight: ${MATCH_LOCATION_WEIGHT:0.25}
    date-weight: ${MATCH_DATE_WEIGHT:0.15}
    threshold: ${MATCH_THRESHOLD:0.55}
    date-window-days: ${MATCH_DATE_WINDOW_DAYS:30}
  security:
    initial-admin-email: ${INITIAL_ADMIN_EMAIL:admin@campus.example}
    initial-admin-password: ${INITIAL_ADMIN_PASSWORD}
