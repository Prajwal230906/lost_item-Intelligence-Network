<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Campus Find</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="auth-wrap"><div class="auth-aside"><span class="eyebrow">Join the campus network</span><h1>Little details.<br>Real connections.</h1><p>Create a private account to report items and follow possible matches.</p></div><section class="auth-card"><h2>Create your account</h2><p class="muted">It takes less than a minute.</p><form method="post" th:action="@{/register}" th:object="${form}" class="form-stack"><label>Your name<input th:field="*{name}" maxlength="100" required><small class="field-error" th:errors="*{name}"></small></label><label>Email address<input th:field="*{email}" type="email" maxlength="190" required><small class="field-error" th:errors="*{email}"></small></label><label>Password<input th:field="*{password}" type="password" minlength="10" maxlength="72" required><small class="field-error" th:errors="*{password}"></small></label><button class="button button-primary full" type="submit">Create account <span>→</span></button></form><p class="auth-switch">Already registered? <a href="/login">Sign in</a></p></section></main><div th:replace="~{fragments :: footer}"></div></body></html>
