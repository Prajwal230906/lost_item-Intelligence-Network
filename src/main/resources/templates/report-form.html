<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New report · Campus Find</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="page-wrap narrow"><a class="back-link" href="/dashboard">← Back to my activity</a><span class="eyebrow">Tell us what happened</span><h1>Make a report</h1><p class="muted">Clear details help the matching engine find useful leads.</p><form th:action="@{/reports}" th:object="${form}" method="post" class="form-card form-stack"><label>Report type<select th:field="*{type}"><option value="LOST">I lost an item</option><option value="FOUND">I found an item</option></select></label><label>Short title<input th:field="*{title}" maxlength="80" placeholder="e.g. Navy blue water bottle" required><small class="field-error" th:errors="*{title}"></small></label><div class="form-row"><label>Category<input th:field="*{category}" maxlength="40" placeholder="Electronics, clothing…" required><small class="field-error" th:errors="*{category}"></small></label><label>Date last seen / found<input th:field="*{itemDate}" type="date" required><small class="field-error" th:errors="*{itemDate}"></small></label><label>Approximate time (optional)<input th:field="*{itemTime}" type="time"></label></div><label>Where was it lost or found?<input th:field="*{location}" maxlength="120" placeholder="Building, room, or campus area" required><small class="field-error" th:errors="*{location}"></small></label><label>Description<textarea th:field="*{description}" rows="5" maxlength="2000" placeholder="Color, material, distinguishing marks, or contents. Avoid posting private information." required></textarea><small class="field-error" th:errors="*{description}"></small></label><div class="form-footer"><span>Only share details that help identify the item safely.</span><button class="button button-primary" type="submit">Publish report <span>→</span></button></div></form></main><div th:replace="~{fragments :: footer}"></div></body></html>
