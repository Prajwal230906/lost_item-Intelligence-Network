<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Campus Find</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="auth-wrap"><div class="auth-aside"><span class="eyebrow">Welcome back</span><h1>Good things<br>find their way.</h1><p>Sign in to manage your reports and review possible connections.</p></div><section class="auth-card"><div th:replace="~{fragments :: flash}"></div><h2>Sign in</h2><p class="muted">Use your campus account to continue.</p><div th:if="${param.error}" class="error-banner">Email or password was not recognized. If you have not registered yet, <a href="/register">create an account</a>.</div><form method="post" th:action="@{/login}" class="form-stack"><label>Email address<input type="email" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button button-primary full" type="submit">Sign in <span>→</span></button></form><p class="auth-switch">New here? <a href="/register">Create an account</a></p></section></main><div th:replace="~{fragments :: footer}"></div></body></html>
