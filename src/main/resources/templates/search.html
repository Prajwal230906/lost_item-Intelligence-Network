<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse reports · Campus Find</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="page-wrap"><span class="eyebrow">Campus community reports</span><h1>Browse and discover</h1><p class="muted">Search item details and campus places to find reports worth a closer look.</p><form class="search-bar" action="/search" method="get"><input name="q" th:value="${q}" placeholder="Try black wallet or library" aria-label="Search reports"><select name="type" aria-label="Filter by report type"><option value="">All reports</option><option value="LOST" th:selected="${type!=null and type.name()=='LOST'}">Lost</option><option value="FOUND" th:selected="${type!=null and type.name()=='FOUND'}">Found</option></select><button class="button button-primary">Search →</button></form><section class="report-grid"><article class="report-card" th:each="r:${reports}"><div class="card-top"><span class="pill" th:classappend="${r.type.name()=='LOST'?'pill-lost':'pill-found'}" th:text="${r.type}"></span><span class="card-date" th:text="${r.itemDate}"></span></div><h3 th:text="${r.title}"></h3><p th:text="${r.description}"></p><div class="card-meta"><span th:text="${r.category}"></span> · <span th:text="${r.location}"></span></div><a class="card-link" th:href="@{/reports/{id}(id=${r.id})}">View report ↗</a></article><div class="empty-card" th:if="${#lists.isEmpty(reports)}"><h3>No reports found</h3><p>Try another keyword or check back as new reports are added.</p></div></section></main><div th:replace="~{fragments :: footer}"></div></body></html>
