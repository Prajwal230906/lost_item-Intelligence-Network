<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report details · Campus Find</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="page-wrap narrow"><a class="back-link" href="/search">← Browse reports</a><article class="detail-card"><div class="card-top"><span class="pill" th:classappend="${report.type.name()=='LOST'?'pill-lost':'pill-found'}" th:text="${report.type}"></span><span class="card-date" th:text="${report.itemDate}"></span></div><span class="eyebrow" th:text="${report.category}"></span><h1 th:text="${report.title}"></h1><p class="detail-description" th:text="${report.description}"></p><div class="detail-facts"><div><small>Last seen / found at</small><b th:text="${report.location}"></b></div><div><small>Report status</small><b th:text="${report.status}"></b></div></div><div class="detail-note"><span>✦</span><p>Potential matches use category, description, location and date similarities. Arrange item return only through trusted campus procedures.</p></div></article></main><div th:replace="~{fragments :: footer}"></div></body></html>
