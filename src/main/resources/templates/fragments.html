<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<header th:fragment="nav" class="topbar"><a class="brand" href="/"><span class="brand-mark">L</span><span>Lost &amp; Found<small class="brand-sub">Campus network</small></span></a><nav><a href="/search">Browse</a><a href="/dashboard" sec:authorize="isAuthenticated()">My activity</a><a href="/admin" sec:authorize="hasRole('ADMIN')">Admin</a></nav><div class="nav-actions"><a class="button button-quiet" href="/login" sec:authorize="!isAuthenticated()">Sign in</a><a class="button button-primary" href="/register" sec:authorize="!isAuthenticated()">Create account</a><form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()"><button class="button button-quiet" type="submit">Sign out</button></form></div></header>
<div th:fragment="flash"><div th:if="${notice}" class="notice" role="status" th:text="${notice}"></div><div th:if="${error}" class="error-banner" role="alert" th:text="${error}"></div></div><footer th:fragment="footer" class="footer"><span>Lost-Item Intelligence Network</span><span>Campus reports, handled with care.</span></footer>
</body></html>
